[build-system]
# no package is built (package-mode = false), but conda-lock relies on build-backend to detect poetry
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "python-training"
description = "Open Source Training"
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["python", "training", "geoscience", "geoh5"]
dynamic = ["dependencies", "classifiers"]
authors = [
    { name = "Mira Geoscience", email = "support@mirageoscience.com" }
]
maintainers = [
    { name = "Benjamin Kary", email = "benjamink@mirageoscience.com" },
    { name = "Dominique Fournier", email = "dominiquef@mirageoscience.com" }
]

[project.urls]
homepage = "https://www.mirageoscience.com/mining-industry-software/python-integration/"
repository = "https://github.com/MiraGeoscience/python-training"

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0,<3.0"

classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]

[tool.poetry.dependencies]
matplotlib = "~3.10.4"
notebook = "^7.4"  # required by start_training.bat
numpy = "~2.4.2"  # also in geoh5py

## pip dependencies from Git repositories
#----------------------------------------
# geoh5py = {version = ">=0.14.0a, 0.14.*", source = "pypi", allow-prereleases = true}
geoh5py = {git = "https://github.com/MiraGeoscience/geoh5py.git", rev = "develop"}

[tool.poetry.group.dev.dependencies]
jupyter-book = "^1.0"
jupytext = "^1.14"
nbconvert = "~7.16.4"
pylint = "*"
pytest = "*"
pytest-cov = "*"

[tool.conda-lock]
platforms = ['win-64', 'linux-64']
channels = ['conda-forge']

[tool.conda-lock.dependencies]
## indirect dependencies, forcing them here for installation through Conda not pip
#---------------------------------------------------------------------------------
h5py = ">=3.15.1, 3.15.*"  # from geoh5py
Pillow = ">=12.2.0, 12.*"  # from geoh5py
psutil = ">=7.2.2, 7.2.*"  # from geoh5py

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B028",  # no-explicit-stacklevel for warnings.warn()
    "E501",  # line-too-long - code is reformatted (do not care about comments and docstring)
    "F401",  # unsused-import - covered by pycln
    "RUF005",  # collection-literal-concatenation - wrong suggestion with numpy arrays
]
select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "B006",  # Do not use mutable data structures for argument defaults
    "B9",  # flake8-bugbear opiniated warnings
    "BLE",  # flake8-blind-except
    "C4",  # flake8-comprehensions
    "C9",  # mccabe
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "RUF",  # ruff rules
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",  # pycodestyle warnings
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
# default formatting is just fine

[tool.mypy]
warn_unused_configs = true
ignore_missing_imports = true
scripts_are_modules = true
show_error_context = true
show_column_numbers = true
check_untyped_defs = true

plugins = [
    "pydantic.mypy"
]
