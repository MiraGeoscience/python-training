[build-system]
requires = [
  "poetry-core >=1.8.0",
  "poetry-dynamic-versioning >=1.9.1, ==1.*",
  # list dependencies to work with PIP_NO_DEPS=1
  "MarkupSafe >=2.0",
  "dunamai >=1.25, ==1.*",
  "jinja2 ==3.*",
  "packaging >=24.0",
  "tomlkit >=0.13",
]
build-backend = "poetry_dynamic_versioning.backend"


[project]
name = "python-training"
requires-python = ">=3.12, <3.14"
readme = "README.md"
description = "Open Source Training"
dynamic = ["version", "dependencies", "classifiers"]
authors = [{ name = "Mira Geoscience", email = "support@mirageoscience.com" }]
maintainers = [
  { name = "Benjamin Kary", email = "benjamink@mirageoscience.com" },
  { name = "Dominique Fournier", email = "dominiquef@mirageoscience.com" }
]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "python-training"
version = "0.0.0.dev0"
packages = [
    { include = "scripts"},
]
requires-poetry = "2.*"

[tool.poetry.dependencies]
matplotlib = "~3.10.4"  # also in geoapps-utils
numpy = "~2.4.2"
jupyter-book = "~1.0"
jupytext = "^1.14"
nbconvert = "~7.16.4"
pytest = "*"
ipywidgets = "^7.6.5"
sphinx = "^5.0"

## pip dependencies
# geoh5py = {version = "~0.9.0-alpha.2", source = "pypi", allow-prereleases = true}
geoh5py = {git = "https://github.com/MiraGeoscience/geoh5py.git", rev = "develop"}


[tool.poetry.group.dev.dependencies]
Pygments = "*"
pylint = "*"
pytest = "*"
pytest-cov = "*"
pyyaml = '*'
packaging = '*'
readthedocs-sphinx-ext = "*"

[tool.conda-lock]
platforms = ['win-64', 'linux-64']
channels = ['conda-forge']

[tool.conda-lock.dependencies]
h5py = ">=3.15.1, 3.*"  # from geoh5py

[tool.isort]
# settings for compatibility between ``isort`` and ``black`` formatting
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.black]
# defaults are just fine

[tool.poetry2conda]
name = "python-training"



[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.9.1, 1.*", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
bump = true
enable = true
fix-shallow-repository = true
strict = true
style = "pep440"
vcs = "git"

[tool.poetry-dynamic-versioning.substitution]
files = ["_version.py", "_version.json"]
patterns = [
    '''(^__version__\s*(?::.*?)?=\s*['"])[^'"]*(['"])''',
    '''(^{\s*"version"\s*:\s*")[^"]*("\s*})''',
]

[tool.poetry-dynamic-versioning.files."_version.py"]
persistent-substitution = true
initial-content = """
  __version__ = "0.0.0.dev0"
"""

[tool.poetry-dynamic-versioning.files."_version.json"]
persistent-substitution = true
initial-content = """
{ "version": "0.0.0.dev0" }
"""

[tool.ruff]
target-version = "py312"

[tool.mypy]
warn_unused_configs = true
ignore_missing_imports = true
scripts_are_modules = true
show_error_context = true
show_column_numbers = true
check_untyped_defs = true

plugins = [
    "pydantic.mypy"
]
