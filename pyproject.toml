[tool.poetry]
name = "python-training"
version = "0.1.0"
description = "Open-source Python training for Geoscience ANALYST"
authors = ["Mira Geoscience <support@mirageoscience.com>"]
packages = [
    { include = "training" },
    { include = "training-assets" },
]
readme = "package.rst"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.0" # also in geoh5py, simpeg


## pip dependencies
geoh5py = {version = ">=0.11.0a, <0.12.dev", source = "pypi", allow-prereleases = true}

[tool.poetry.group.dev.dependencies]
pylint = "*"
pytest = "*"
pytest-cov = "*"
sphinx = "^5.0"
readthedocs-sphinx-ext = "*"
nbconvert = "^7.16.4"
jupyter-book = "*"
jupytext = "^1.14"
ipywidgets = "^7.6.5"

[tool.conda-lock.dependencies]
h5py = ">=3.2.1, <4.0.dev"  # from geoh5py
matplotlib-base = ">=3.8.4, <3.9.dev"  # from simpeg
Pillow = ">=10.3.0, <10.4.dev"  # from geoh5py

[tool.conda-lock]
platforms = ['win-64', 'linux-64']
channels = ['conda-forge']

[tool.isort]
# settings for compatibility between ``isort`` and ``black`` formatting
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.black]
# defaults are just fine

[tool.poetry2conda]
name = "python-training"

[build-system]
requires = ["poetry-core>=1.0.0", "setuptools"]
build-backend = "poetry.core.masonry.api"
