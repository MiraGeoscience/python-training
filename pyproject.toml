[project]
name = "python-training"
requires-python = ">=3.12, <3.14"
readme = "package.rst"
description = "Open Source Training"
dynamic = ["version", "dependencies", "classifiers"]
authors = [{ name = "Mira Geoscience", email = "support@mirageoscience.com" }]
maintainers = [
  { name = "Benjamin Kary", email = "benjamink@mirageoscience.com" },
  { name = "Dominique Fournier", email = "dominiquef@mirageoscience.com" }
]


[tool.poetry]
name = "python-training"
version = "0.0.0.dev0"
packages = [
    { include = "scripts"},
]
requires-poetry = "2.*"

[tool.poetry.dependencies]
matplotlib = "~3.10.4"  # also in geoapps-utils
numpy = "~2.4.2"
jupyter-book = "*"
jupytext = "^1.14"
nbconvert = "~7.16.4"
pytest = "*"

## pip dependencies
# geoh5py = {version = "~0.9.0-alpha.2", source = "pypi", allow-prereleases = true}
geoh5py = {git = "https://github.com/MiraGeoscience/geoh5py.git", rev = "develop"}


[tool.poetry.dev-dependencies]
pylint = "^2.14.4"
pytest = "^7.1.2"
pytest-cov = "^3.0.0"

[tool.conda-lock]
platforms = ['win-64', 'linux-64']
channels = ['conda-forge']

[tool.conda-lock.dependencies]
h5py = ">=3.15.1, 3.*"  # from geoh5py

[tool.isort]
# settings for compatibility between ``isort`` and ``black`` formatting
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.black]
# defaults are just fine

[tool.poetry2conda]
name = "python-training"

[build-system]
requires = [
  "poetry-core >=1.8.0",
  "poetry-dynamic-versioning >=1.9.1, ==1.*",
  # list dependencies to work with PIP_NO_DEPS=1
  "MarkupSafe >=2.0",
  "dunamai >=1.25, ==1.*",
  "jinja2 ==3.*",
  "packaging >=24.0",
  "tomlkit >=0.13",
]
build-backend = "poetry_dynamic_versioning.backend"

