version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "mambaforge-22.9"
  jobs:
    post_checkout:
      # Download and uncompress the binary
      # https://git-lfs.github.com/
      - wget https://github.com/git-lfs/git-lfs/releases/download/v3.1.4/git-lfs-linux-amd64-v3.1.4.tar.gz
      - tar xvfz git-lfs-linux-amd64-v3.1.4.tar.gz
      # Modify LFS config paths to point where git-lfs binary was downloaded
      - git config filter.lfs.process "`pwd`/git-lfs filter-process"
      - git config filter.lfs.smudge  "`pwd`/git-lfs smudge -- %f"
      - git config filter.lfs.clean "`pwd`/git-lfs clean -- %f"
      # Make LFS available in current repository
      - ./git-lfs install
      # Download content from remote
      - ./git-lfs fetch
      # Make local files to have the real content on them
      - ./git-lfs checkout
    post_create_environment:
      # Install pixi (not available on RTD images) into the conda env's bin dir,
      # which RTD keeps on PATH for all later jobs.
      - curl -fsSL https://pixi.sh/install.sh | PIXI_BIN_DIR="$(dirname "$(command -v python)")" PIXI_NO_PATH_UPDATE=1 bash
    pre_build:
      # Generate on-the-fly Sphinx configuration from Jupyter Book's _config.yml
      - "jupyter-book config sphinx content/"
    build:
      html:
        # pixi run installs the docs environment from pixi.lock on first use
        - pixi run --frozen --environment docs build-docs html "$READTHEDOCS_OUTPUT"
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/htmlzip"
      - cd "$READTHEDOCS_OUTPUT/html" && zip -r ../htmlzip/python-training-docs.zip .

sphinx:
  builder: html
  configuration: content/conf.py
  fail_on_warning: false

conda:
  environment: environments/py-3.12-linux-64-dev.conda.lock.yml
