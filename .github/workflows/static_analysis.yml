name: Static analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
  push:
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-pre-commit:
    name: Pre-Commit
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-pre_commit.yml@9e46551783cee8a8c2c7a30794af4b98e2671729 # v3.13.6
    permissions:
      contents: read
    with:
      python-version: "3.12"
