[workspace]
name = "python-training"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

# Mirrors [tool.poetry.dependencies] and [tool.conda-lock.dependencies] in pyproject.toml
[dependencies]
python = "3.12.*"
matplotlib = "~=3.10.4"
notebook = ">=7.4,<8"
numpy = "~=2.4.2"
h5py = ">=3.15.1,<3.16"
pydantic = ">=2.12.0,<2.13"
pillow = ">=12.2.0,<13"
psutil = ">=7.2.2,<7.3"

[pypi-dependencies]
geoh5py = { git = "https://github.com/MiraGeoscience/geoh5py.git", branch = "develop" }

[feature.docs.dependencies]
jupyter-book = ">=1.0,<2"
jupytext = ">=1.14,<2"
ipykernel = "*"

[feature.docs.tasks.build-docs]
description = "Build the Jupyter Book with sphinx (run 'jupyter-book config sphinx content/' first to generate conf.py)"
cmd = "sphinx-build -T -b {{ builder }} content {{ output }}/{{ builder }}"
args = [
    { arg = "builder", default = "html" },
    { arg = "output", default = "_build" },
]

[environments]
docs = ["docs"]
